// Gradle build file for Barnocraft jMonkeyEngine project

plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    // jMonkeyEngine core
    implementation 'org.jmonkeyengine:jme3-core:3.3.2'
    implementation 'org.jmonkeyengine:jme3-desktop:3.3.2'
    implementation 'org.jmonkeyengine:jme3-lwjgl:3.3.2'
    implementation 'org.jmonkeyengine:jme3-jogg:3.3.2'
    implementation 'org.jmonkeyengine:jme3-plugins:3.3.2'
    
    // LWJGL native libraries
    implementation 'org.lwjgl:lwjgl:3.3.3'
    implementation 'org.lwjgl:lwjgl-assimp:3.3.3'
    implementation 'org.lwjgl:lwjgl-glfw:3.3.3'
    implementation 'org.lwjgl:lwjgl-openal:3.3.3'
    implementation 'org.lwjgl:lwjgl-opengl:3.3.3'
    implementation 'org.lwjgl:lwjgl-stb:3.3.3'
}

application {
    mainClass = 'com.barnocraft.Main'
}

// Configure the jar task to create a fat jar
jar {
    manifest {
        attributes 'Main-Class': 'com.barnocraft.Main'
    }
    
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    
    duplicatesStrategy = 'exclude'
    
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
}

// Task to run the game
task runGame(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.barnocraft.Main'
}
